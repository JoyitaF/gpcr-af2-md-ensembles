[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpcr-af2md"
version = "0.1.0"
description = "Compare AlphaFold2 MSA-subsampling ensembles with GPCRmd molecular dynamics for five GPCRs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
  { name = "Joyita Faruk" },
  { name = "Benjamin Cummins" },
  { name = "George Glidden" },
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "MDAnalysis>=2.7",
  "ProDy>=2.4",
  "matplotlib>=3.7",
  "biopython>=1.81",
  "PyYAML>=6.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gpcr-af2md = "gpcr_af2md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]
