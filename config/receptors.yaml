# All MD comes from GPCRmd (https://www.gpcrmd.org). Each record has three
# 500-ns replicates. Replicate 1 and the topology files download without an
# account. Replicates 2 and 3 need a GPCRmd account; see README "Data".
#
# File URLs follow https://www.gpcrmd.org/dynadb/files/Dynamics/<file_id>_<kind>_<record>.<ext>
# `sha256: null` means the checksum has not been recorded yet. Run
# `gpcr-af2md checksums` on a machine that holds the files and paste the values here.

